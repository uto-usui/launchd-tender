<?xml version="1.0" encoding="UTF-8"?>
<!--
  Tender app icon (Dark) — 候補 A: 新芽 × 聴診器 ダーク版
  背景のみ dim moss、他レイヤーは light と共通構成。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#2F3531"/>
      <stop offset="100%" stop-color="#232825"/>
    </linearGradient>

    <radialGradient id="earpiece" cx="35%" cy="32%" r="75%">
      <stop offset="0%"   stop-color="#DFE3E6"/>
      <stop offset="18%"  stop-color="#B8BCC0"/>
      <stop offset="55%"  stop-color="#8E949A"/>
      <stop offset="85%"  stop-color="#5F666D"/>
      <stop offset="100%" stop-color="#414850"/>
    </radialGradient>

    <radialGradient id="tealReflection" cx="30%" cy="30%" r="38%">
      <stop offset="0%"   stop-color="#7FB8B6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7FB8B6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="tube" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#646A70"/>
      <stop offset="40%"  stop-color="#9AA0A6"/>
      <stop offset="55%"  stop-color="#ACB2B7"/>
      <stop offset="100%" stop-color="#646A70"/>
    </linearGradient>

    <linearGradient id="leaf" x1="0%" y1="50%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#5D9A6E"/>
      <stop offset="50%"  stop-color="#7BB68A"/>
      <stop offset="100%" stop-color="#9FD3AB"/>
    </linearGradient>

    <linearGradient id="leafGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="50%"  stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="tubeJunctionShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#7BB68A" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7BB68A" stop-opacity="0"/>
    </radialGradient>

    <filter id="leafShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="url(#bg)"/>

  <!-- Y 字チューブ -->
  <g stroke-linecap="round" fill="none">
    <path d="M 380 600 C 380 545, 470 505, 512 495 L 512 400"
          stroke="url(#tube)" stroke-width="50"/>
    <path d="M 644 600 C 644 545, 554 505, 512 495"
          stroke="url(#tube)" stroke-width="50"/>
  </g>
  <ellipse cx="512" cy="490" rx="56" ry="22" fill="url(#tubeJunctionShadow)"/>

  <!-- イヤーピース (左) -->
  <circle cx="380" cy="720" r="115" fill="url(#earpiece)"/>
  <circle cx="380" cy="720" r="115" fill="url(#tealReflection)"/>
  <ellipse cx="346" cy="682" rx="28" ry="17" fill="#FFFFFF" opacity="0.42"/>

  <!-- イヤーピース (右) -->
  <circle cx="644" cy="720" r="115" fill="url(#earpiece)"/>
  <circle cx="644" cy="720" r="115" fill="url(#tealReflection)"/>

  <!-- 葉の付け根 (calyx) -->
  <ellipse cx="512" cy="398" rx="24" ry="14" fill="#5D9A6E"/>

  <!-- 新芽: 右葉 (背面) -->
  <g transform="translate(512 398) rotate(-32)">
    <ellipse cx="150" cy="0" rx="150" ry="50" fill="url(#leaf)" filter="url(#leafShadow)"/>
    <path d="M 5 0 Q 150 -8, 295 0"
          stroke="#B0E0BC" stroke-width="4" fill="none" opacity="0.7" stroke-linecap="round"/>
    <ellipse cx="150" cy="0" rx="150" ry="50" fill="url(#leafGlass)"/>
  </g>

  <!-- 新芽: 左葉 (前面) -->
  <g transform="translate(512 398) rotate(-64)">
    <ellipse cx="125" cy="0" rx="125" ry="45" fill="url(#leaf)"/>
    <path d="M 5 0 Q 125 -7, 245 0"
          stroke="#B0E0BC" stroke-width="4" fill="none" opacity="0.7" stroke-linecap="round"/>
    <ellipse cx="125" cy="0" rx="125" ry="45" fill="url(#leafGlass)"/>
    <ellipse cx="238" cy="-5" rx="10" ry="6" fill="#FFFFFF" opacity="0.5"/>
  </g>
</svg>
