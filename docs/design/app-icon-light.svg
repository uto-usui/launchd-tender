<?xml version="1.0" encoding="UTF-8"?>
<!--
  Tender app icon (Light) — 候補 A: 新芽 × 聴診器
  作業用プレビュー SVG。Icon Composer で最終調整前提。
  1024×1024、背景 squircle、Dock 32px で leaf + 2 circles が残る構成。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 背景 squircle -->
    <linearGradient id="bg" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#F7F4ED"/>
      <stop offset="100%" stop-color="#EDE9E0"/>
    </linearGradient>

    <!-- イヤーピース: 金属反射 (Glass base) -->
    <radialGradient id="earpiece" cx="35%" cy="32%" r="75%">
      <stop offset="0%"   stop-color="#F0F2F4"/>
      <stop offset="18%"  stop-color="#CDD2D6"/>
      <stop offset="55%"  stop-color="#A6ACB2"/>
      <stop offset="85%"  stop-color="#7B838A"/>
      <stop offset="100%" stop-color="#616971"/>
    </radialGradient>

    <!-- イヤーピース反射中心の teal -->
    <radialGradient id="tealReflection" cx="30%" cy="30%" r="38%">
      <stop offset="0%"   stop-color="#7FB8B6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7FB8B6" stop-opacity="0"/>
    </radialGradient>

    <!-- 金属チューブ -->
    <linearGradient id="tube" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7C8288"/>
      <stop offset="40%"  stop-color="#B0B5BA"/>
      <stop offset="55%"  stop-color="#C2C6CA"/>
      <stop offset="100%" stop-color="#7C8288"/>
    </linearGradient>

    <!-- 葉の緑グラデ (長手方向に下→上で明るく) -->
    <linearGradient id="leaf" x1="0%" y1="50%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#6AA178"/>
      <stop offset="50%"  stop-color="#7BB68A"/>
      <stop offset="100%" stop-color="#9BCBA7"/>
    </linearGradient>

    <!-- 葉外縁の Liquid Glass (上面のみ朝露感) -->
    <linearGradient id="leafGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="50%"  stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Y 字結合点の緑シャドウ -->
    <radialGradient id="tubeJunctionShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#7BB68A" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7BB68A" stop-opacity="0"/>
    </radialGradient>

    <!-- 葉のソフトシャドウ (わずか) -->
    <filter id="leafShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="url(#bg)"/>

  <!-- Y 字チューブ: 左イヤーピース → 結合点 → 中央上昇 / 右イヤーピース → 結合点 -->
  <g stroke-linecap="round" fill="none">
    <path d="M 380 600 C 380 545, 470 505, 512 495 L 512 400"
          stroke="url(#tube)" stroke-width="50"/>
    <path d="M 644 600 C 644 545, 554 505, 512 495"
          stroke="url(#tube)" stroke-width="50"/>
  </g>
  <!-- Y 字結合点のグリーンシャドウ -->
  <ellipse cx="512" cy="490" rx="56" ry="22" fill="url(#tubeJunctionShadow)"/>

  <!-- イヤーピース (左) -->
  <circle cx="380" cy="720" r="115" fill="url(#earpiece)"/>
  <circle cx="380" cy="720" r="115" fill="url(#tealReflection)"/>
  <ellipse cx="346" cy="682" rx="28" ry="17" fill="#FFFFFF" opacity="0.55"/>

  <!-- イヤーピース (右) -->
  <circle cx="644" cy="720" r="115" fill="url(#earpiece)"/>
  <circle cx="644" cy="720" r="115" fill="url(#tealReflection)"/>

  <!-- 葉の付け根 (calyx): 緑のドームでチューブと葉を視覚的につなぐ -->
  <ellipse cx="512" cy="398" rx="24" ry="14" fill="#6AA178"/>

  <!-- 新芽: 右葉 (背面) — 斜め右上に長く、先端は少し上向き -->
  <g transform="translate(512 398) rotate(-32)">
    <ellipse cx="150" cy="0" rx="150" ry="50" fill="url(#leaf)" filter="url(#leafShadow)"/>
    <!-- 葉脈 -->
    <path d="M 5 0 Q 150 -8, 295 0"
          stroke="#A8D8B4" stroke-width="4" fill="none" opacity="0.7" stroke-linecap="round"/>
    <!-- 葉外縁 Glass 朝露感 -->
    <ellipse cx="150" cy="0" rx="150" ry="50" fill="url(#leafGlass)"/>
  </g>

  <!-- 新芽: 左葉 (前面) — より立った角度、短め -->
  <g transform="translate(512 398) rotate(-64)">
    <ellipse cx="125" cy="0" rx="125" ry="45" fill="url(#leaf)"/>
    <!-- 葉脈 -->
    <path d="M 5 0 Q 125 -7, 245 0"
          stroke="#A8D8B4" stroke-width="4" fill="none" opacity="0.7" stroke-linecap="round"/>
    <!-- 葉外縁 Glass -->
    <ellipse cx="125" cy="0" rx="125" ry="45" fill="url(#leafGlass)"/>
    <!-- 葉先の specular highlight -->
    <ellipse cx="238" cy="-5" rx="10" ry="6" fill="#FFFFFF" opacity="0.65"/>
  </g>
</svg>
