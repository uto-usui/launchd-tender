<?xml version="1.0" encoding="UTF-8"?>
<!--
  Tender app icon (Light) — 線画スタイル
  候補 A の構図（新芽 × 聴診器）を line-art で再構成。
  単色インク + 葉だけ ghostly な systemGreen。1024×1024、squircle 背景。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- ほんのり緑の葉フィル (朝露感、背景とのコントラストは線で出す) -->
    <linearGradient id="leafTint" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7BB68A" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#7BB68A" stop-opacity="0.28"/>
    </linearGradient>
  </defs>

  <!-- 背景 squircle -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="#F4F1EA"/>

  <!-- 全体のインクレイヤー (共通の stroke 設定) -->
  <g stroke="#2F3531" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Y 字チューブ (左 + 中央縦を 1 本、右を別に) -->
    <path d="M 380 600 C 380 545, 470 505, 512 495 L 512 400"/>
    <path d="M 644 600 C 644 545, 554 505, 512 495"/>

    <!-- イヤーピース 2 円 -->
    <circle cx="380" cy="720" r="115"/>
    <circle cx="644" cy="720" r="115"/>

    <!-- 葉の付け根 calyx (小さなドーム) -->
    <path d="M 488 398 Q 512 378, 536 398"/>
  </g>

  <!-- 葉: 透明フィル + インク輪郭 + 葉脈 -->
  <g transform="translate(512 398)">
    <!-- 右葉 (背面) -->
    <g transform="rotate(-32)">
      <ellipse cx="150" cy="0" rx="150" ry="50" fill="url(#leafTint)"/>
      <ellipse cx="150" cy="0" rx="150" ry="50"
               stroke="#2F3531" stroke-width="22" fill="none"/>
      <!-- 葉脈 -->
      <path d="M 8 0 Q 150 -8, 292 0"
            stroke="#2F3531" stroke-width="10" fill="none"
            stroke-linecap="round" opacity="0.85"/>
    </g>

    <!-- 左葉 (前面) -->
    <g transform="rotate(-64)">
      <ellipse cx="125" cy="0" rx="125" ry="45" fill="url(#leafTint)"/>
      <ellipse cx="125" cy="0" rx="125" ry="45"
               stroke="#2F3531" stroke-width="22" fill="none"/>
      <path d="M 8 0 Q 125 -7, 242 0"
            stroke="#2F3531" stroke-width="10" fill="none"
            stroke-linecap="round" opacity="0.85"/>
    </g>
  </g>
</svg>
