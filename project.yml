name: Tender
options:
    bundleIdPrefix: com.uto-usui
    deploymentTarget:
        macOS: "15.0"
    createIntermediateGroups: true
    groupSortPosition: top
    generateEmptyDirectories: true
    xcodeVersion: "16.0"
configs:
    Debug: debug
    Release: release
settings:
    base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        DEAD_CODE_STRIPPING: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
packages:
    TenderCore:
        path: TenderCore
targets:
    Tender:
        type: application
        platform: macOS
        sources:
            - path: Tender
        dependencies:
            - package: TenderCore
              product: TenderCore
        settings:
            base:
                PRODUCT_BUNDLE_IDENTIFIER: com.uto-usui.tender
                PRODUCT_NAME: Tender
                INFOPLIST_KEY_CFBundleDisplayName: Tender
                INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
                INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 uto-usui. All rights reserved."
                INFOPLIST_KEY_NSMainStoryboardFile: ""
                ENABLE_HARDENED_RUNTIME: YES
                COMBINE_HIDPI_IMAGES: YES
